<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="manifest" href="manifest.json">

    <title>My Rule, My World</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="app">

        <!-- =========================
             HEADER
             ========================= -->

        <header class="header">

            <div class="logo">
                👜
            </div>

            <h1>
                My Rule, My World
            </h1>

            <p>
                Your business at a glance
            </p>

        </header>


        <!-- =========================
             DASHBOARD
             ========================= -->

        <section class="dashboard">

            <div class="dashboard-heading">

                <p class="dashboard-label">
                    OVERVIEW
                </p>

                <h2>
                    Good morning ✨
                </h2>

            </div>


            <!-- =========================
                 STAT CARDS
                 ========================= -->

            <div class="stats-grid">

                <!-- INVENTORY -->

                <div class="stat-card">

                    <div class="stat-icon">
                        👜
                    </div>

                    <div>

                        <p class="stat-label">
                            ITEMS IN STOCK
                        </p>

                        <h3 id="total-stock">
                            0
                        </h3>

                    </div>

                </div>


                <!-- ORDERS -->

                <div class="stat-card">

                    <div class="stat-icon">
                        📦
                    </div>

                    <div>

                        <p class="stat-label">
                            TOTAL ORDERS
                        </p>

                        <h3 id="total-orders">
                            0
                        </h3>

                    </div>

                </div>


                <!-- PENDING -->

                <div class="stat-card">

                    <div class="stat-icon">
                        ⏳
                    </div>

                    <div>

                        <p class="stat-label">
                            PENDING
                        </p>

                        <h3 id="pending-orders">
                            0
                        </h3>

                    </div>

                </div>


                <!-- COMPLETED -->

                <div class="stat-card">

                    <div class="stat-icon">
                        ✓
                    </div>

                    <div>

                        <p class="stat-label">
                            COMPLETED
                        </p>

                        <h3 id="completed-orders">
                            0
                        </h3>

                    </div>

                </div>

            </div>


            <!-- =========================
                 QUICK ACTIONS
                 ========================= -->

            <div class="dashboard-heading quick-heading">

                <p class="dashboard-label">
                    QUICK ACTIONS
                </p>

            </div>


            <div class="menu">

                <a
                    href="orders.html"
                    class="menu-card"
                >

                    <span class="icon">
                        📦
                    </span>

                    <div>

                        <h2>
                            Orders
                        </h2>

                        <p>
                            Manage customer orders
                        </p>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </a>


                <a
                    href="inventory.html"
                    class="menu-card"
                >

                    <span class="icon">
                        👜
                    </span>

                    <div>

                        <h2>
                            Inventory
                        </h2>

                        <p>
                            Manage your inventory
                        </p>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </a>

            </div>


        </section>

    </main>


    <script src="app.js"></script>
    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .then(() => console.log("Service worker registered"))
            .catch(error => console.error("Service worker registration failed:", error));
    });
}
</script>

</body>

</html>
